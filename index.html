<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />
  <meta name="theme-color" content="#f5efe7">
  <meta property="og:title" content="Hello Monday Cafe Menu">
  <meta property="og:description" content="Coffee • Dessert • Slow Moments">
  <meta property="og:image" content="images/Menu-02.webp">

  <link rel="preload" as="image" href="images/Menu-02.webp">
  <link rel="icon" href="images/favicon.png">

  <title>Hello Monday cafe</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        linear-gradient(rgba(255, 255, 255, .35), rgba(255, 255, 255, .35)),
        url("https://www.transparenttextures.com/patterns/paper-fibers.png");

      background-color: #f5efe7;
      font-family: Georgia, serif;
      color: #4b3828;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      animation: fade .4s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245, 239, 231, .78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(219, 202, 182, .55);
      padding: 16px 20px;
    }

    .header small {
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #9a7d5f;
      font-size: 10px;
    }

    .header h1 {
      margin-top: 4px;
      font-size: 24px;
      font-weight: normal;
    }

    .menu-wrapper {
      position: relative;
      padding: 12px 8px 16px;
    }

    .menu-title {
      margin-bottom: 14px;
    }

    .menu-title small {
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9b8268;
      font-size: 10px;
    }

    .menu-title h2 {
      margin-top: 4px;
      font-weight: normal;
    }

    .gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 10px;
      padding-inline: 1%;

      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;

      scrollbar-width: none;

      mask-image: linear-gradient(to right,
          transparent,
          black 2%,
          black 98%,
          transparent);
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    .card {
      min-width: 96%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      border-radius: 20px;
      overflow: hidden;
      background: white;
      box-shadow: 0 8px 24px rgba(60, 40, 20, .08);
      border: 1px solid #dcc9b4;
      position: relative;
    }

    .card img {
      width: 100%;
      display: block;
      height: auto;
      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;
    }


    .counter {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;

      margin: 10px 0 6px;
    }

    .page-indicator {
      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 15px;
      letter-spacing: .04em;

      color: #7a6048;
    }

    #current {
      font-size: 18px;
      color: #4b3828;
    }

    #total {
      opacity: .55;
    }

    .nav {
      width: 32px;
      height: 32px;

      border: 1px solid rgba(220, 201, 181, .5);
      border-radius: 999px;



      background: rgba(255, 255, 255, .45);

      backdrop-filter: blur(8px);

      color: #6f5845;

      font-size: 20px;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition: .18s ease;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, .05);
    }

    .nav:active {
      transform: scale(.92);
    }

    .viewer {
      position: fixed;
      inset: 0;

      background: rgba(20, 16, 12, .94);

      display: flex;
      align-items: center;
      justify-content: center;

      opacity: 0;
      visibility: hidden;

      transition: .25s ease;

      z-index: 9999;

      padding: 20px;
    }

    .viewer.active {
      opacity: 1;
      visibility: visible;
    }

    .viewer img {
      width: 100%;
      max-width: 1200px;
      max-height: 100%;

      object-fit: contain;

      border-radius: 12px;

      user-select: none;
      -webkit-user-drag: none;
    }

    .close-viewer {
      position: absolute;
      top: 18px;
      right: 18px;

      width: 40px;
      height: 40px;

      border: none;
      border-radius: 999px;

      background: rgba(255, 255, 255, .12);

      backdrop-filter: blur(10px);

      color: white;

      font-size: 28px;
      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <small>Hello Monday cafe</small>
  </div>

  <div class="menu-wrapper">

    <div class="gallery">


      <div class="card">
        <img src="images/Menu-02.webp">
      </div>

      <div class="card">
        <img src="images/Menu-03.webp">
      </div>

      <div class="card">
        <img src="images/Menu-04.webp">
      </div>

      <div class="card">
        <img src="images/Menu-05.webp">
      </div>

      <div class="card">
        <img src="images/Menu-06.webp">
      </div>

      <div class="card">
        <img src="images/Menu-07.webp">
      </div>

      <div class="card">
        <img src="images/Menu-08.webp">
      </div>

      <div class="card">
        <img src="images/Menu-09.webp">
      </div>

      <div class="card">
        <img src="images/Menu-10.webp">
      </div>

    </div>


    <div class="counter">

      <button class="nav prev">
        ‹
      </button>

      <div class="page-indicator">
        <span id="current">1</span>
        /
        <span id="total">9</span>
      </div>

      <button class="nav next">
        ›
      </button>

    </div>

  </div>

  <div class="viewer" id="viewer">

    <button class="close-viewer" id="closeViewer">
      ×
    </button>

    <img id="viewerImage">

  </div>


  <script>
    const gallery = document.querySelector('.gallery');
    const cards = document.querySelectorAll('.card');

    const current = document.getElementById('current');
    const total = document.getElementById('total');

    total.textContent = cards.length;

    gallery.addEventListener('scroll', () => {
      const galleryCenter =
        gallery.scrollLeft + gallery.offsetWidth / 2;

      let activeIndex = 0;

      cards.forEach((card, index) => {
        const cardCenter =
          card.offsetLeft + card.offsetWidth / 2;

        const distance =
          Math.abs(galleryCenter - cardCenter);

        if (
          distance <
          Math.abs(
            galleryCenter -
            (cards[activeIndex].offsetLeft +
              cards[activeIndex].offsetWidth / 2)
          )
        ) {
          activeIndex = index;
        }
      });

      current.textContent = activeIndex + 1;
    });
  </script>

  <script>
    let touched = false;

    gallery.addEventListener('touchstart', () => {
      touched = true;
    });

    window.addEventListener('load', () => {

      if (touched) return;

      setTimeout(() => {

        if (touched) return;

        gallery.scrollBy({
          left: 36,
          behavior: 'smooth'
        });

        setTimeout(() => {

          if (touched) return;

          gallery.scrollBy({
            left: -60,
            behavior: 'smooth'
          });

        }, 500);

      }, 450);

    });
  </script>

  <script>
    const nextBtn = document.querySelector('.next');
    const prevBtn = document.querySelector('.prev');

    nextBtn.addEventListener('click', () => {
      gallery.scrollBy({
        left: gallery.offsetWidth * 0.9,
        behavior: 'smooth'
      });
    });

    prevBtn.addEventListener('click', () => {
      gallery.scrollBy({
        left: -gallery.offsetWidth * 0.9,
        behavior: 'smooth'
      });
    });
  </script>

  <script>
    const viewer = document.getElementById('viewer');
    const viewerImage = document.getElementById('viewerImage');
    const closeViewer = document.getElementById('closeViewer');

    const images = document.querySelectorAll('.card img');

    images.forEach(img => {

      img.addEventListener('click', () => {

        viewerImage.src = img.src;

        viewer.classList.add('active');

        document.body.style.overflow = 'hidden';

      });

    });

    function closeModal() {

      viewer.classList.remove('active');

      document.body.style.overflow = '';

    }

    closeViewer.addEventListener('click', closeModal);

    viewer.addEventListener('click', (e) => {

      if (e.target === viewer) {
        closeModal();
      }

    });
  </script>

</body>

</html>
