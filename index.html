<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5efe7">
  <meta property="og:title" content="Hello Monday Cafe Menu">
  <meta property="og:description" content="Coffee • Dessert • Slow Moments">
  <meta property="og:image" content="images/Menu-02.webp">

  <link rel="preload" as="image" href="images/Menu-02.webp">
  <link rel="icon" href="images/favicon.png">

  <title>Hello Monday cafe</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        linear-gradient(rgba(255, 255, 255, .35), rgba(255, 255, 255, .35)),
        url("https://www.transparenttextures.com/patterns/paper-fibers.png");

      background-color: #f5efe7;
      font-family: Georgia, serif;
      color: #4b3828;
      overflow-x: hidden;
      overscroll-behavior-x: none;
      animation: fade .4s ease;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245, 239, 231, .78);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(219, 202, 182, .55);
      padding: 16px 20px;
    }

    .header small {
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #9a7d5f;
      font-size: 10px;
    }

    .header h1 {
      margin-top: 4px;
      font-size: 24px;
      font-weight: normal;
    }

    .menu-wrapper {
      position:relative;
      padding: 12px 8px 16px;
    }

    .menu-title {
      margin-bottom: 14px;
    }

    .menu-title small {
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9b8268;
      font-size: 10px;
    }

    .menu-title h2 {
      margin-top: 4px;
      font-weight: normal;
    }

    .gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 10px;
      padding-inline: 1%;

      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;

      scrollbar-width: none;

      mask-image: linear-gradient(to right,
          transparent,
          black 4%,
          black 96%,
          transparent);
    }

    .gallery::-webkit-scrollbar {
      display: none;
    }

    .card {
      min-width: 96%;
      scroll-snap-align: center;
      scroll-snap-stop: always;
      border-radius: 20px;
      overflow: hidden;
      background: white;
      box-shadow: 0 8px 24px rgba(60, 40, 20, .08);
      border: 1px solid #dcc9b4;
      position: relative;
    }

    .card img {
      width: 100%;
      display: block;
      height: auto;
      object-fit: contain;

      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }


    .counter {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;

      margin: 10px 0 6px;

      font-size: 15px;
      letter-spacing: .04em;

      color: #7a6048;
    }

    #current {
      font-size: 18px;
      color: #4b3828;
    }

    #total {
      opacity: .55;
    }

    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 38px;
      height: 38px;

      border: none;
      border-radius: 999px;

      background: rgba(255, 255, 255, .45);
      backdrop-filter: blur(8px);

      color: #6f5845;
      font-size: 22px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      box-shadow: 0 4px 12px rgba(0, 0, 0, .06);

      z-index: 20;

      transition: .2s ease;
    }

    .nav:active {
      transform:
        translateY(-50%) scale(.94);
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <small>Hello Monday cafe</small>
  </div>

  <div class="menu-wrapper">

    <div class="gallery">


      <div class="card">
        <img src="images/Menu-02.webp">
      </div>

      <div class="card">
        <img src="images/Menu-03.webp">
      </div>

      <div class="card">
        <img src="images/Menu-04.webp">
      </div>

      <div class="card">
        <img src="images/Menu-05.webp">
      </div>

      <div class="card">
        <img src="images/Menu-06.webp">
      </div>

      <div class="card">
        <img src="images/Menu-07.webp">
      </div>

      <div class="card">
        <img src="images/Menu-08.webp">
      </div>

      <div class="card">
        <img src="images/Menu-09.webp">
      </div>

      <div class="card">
        <img src="images/Menu-10.webp">
      </div>

    </div>

    <button class="nav prev">‹</button>
    <button class="nav next">›</button>

    <div class="counter">
      <span id="current">1</span>
      /
      <span id="total">9</span>
    </div>

  </div>


  <script>
    const gallery = document.querySelector('.gallery');
    const cards = document.querySelectorAll('.card');

    const current = document.getElementById('current');
    const total = document.getElementById('total');

    total.textContent = cards.length;

    gallery.addEventListener('scroll', () => {
      const galleryCenter =
        gallery.scrollLeft + gallery.offsetWidth / 2;

      let activeIndex = 0;

      cards.forEach((card, index) => {
        const cardCenter =
          card.offsetLeft + card.offsetWidth / 2;

        const distance =
          Math.abs(galleryCenter - cardCenter);

        if (
          distance <
          Math.abs(
            galleryCenter -
            (cards[activeIndex].offsetLeft +
              cards[activeIndex].offsetWidth / 2)
          )
        ) {
          activeIndex = index;
        }
      });

      current.textContent = activeIndex + 1;
    });
  </script>

  <script>
    let touched = false;

    gallery.addEventListener('touchstart', () => {
      touched = true;
    });

    window.addEventListener('load', () => {

      if (touched) return;

      setTimeout(() => {

        if (touched) return;

        gallery.scrollBy({
          left: 60,
          behavior: 'smooth'
        });

        setTimeout(() => {

          if (touched) return;

          gallery.scrollBy({
            left: -60,
            behavior: 'smooth'
          });

        }, 500);

      }, 900);

    });
  </script>

  <script>
  const nextBtn = document.querySelector('.next');
  const prevBtn = document.querySelector('.prev');

  nextBtn.addEventListener('click', () => {
    gallery.scrollBy({
      left: gallery.offsetWidth * 0.9,
      behavior: 'smooth'
    });
  });

  prevBtn.addEventListener('click', () => {
    gallery.scrollBy({
      left: -gallery.offsetWidth * 0.9,
      behavior: 'smooth'
    });
  });
</script>

</body>

</html>
